<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сбор на кофе</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --tg-theme-bg-color: #1a1a1a;
      --tg-theme-text-color: #fff;
      --tg-theme-button-color: #c9a227;
      --tg-theme-button-text-color: #1a1a1a;
      --tg-theme-secondary-bg-color: #2d2d2d;
      --app-bg: var(--tg-theme-bg-color);
      --app-text: var(--tg-theme-text-color);
      --app-text-muted: rgba(255,255,255,0.65);
      --app-surface: var(--tg-theme-secondary-bg-color);
      --app-accent: #c9a227;
      --app-accent-soft: rgba(201, 162, 39, 0.2);
      --app-radius: 16px;
      --app-radius-sm: 12px;
      --app-shadow: 0 4px 24px rgba(0,0,0,0.15);
      --app-transition: 0.2s ease;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --app-text-muted: rgba(0,0,0,0.55);
        --app-accent-soft: rgba(201, 162, 39, 0.15);
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--app-bg);
      color: var(--app-text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .app {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .screen { display: none; animation: fadeIn 0.25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header-icon {
      font-size: 48px;
      margin-bottom: 8px;
      line-height: 1;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--app-text-muted);
      font-weight: 500;
    }

    .card {
      background: var(--app-surface);
      border-radius: var(--app-radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--app-shadow);
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--app-text-muted);
      margin: 0 0 12px;
    }

    .time-picker-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .time-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: var(--app-radius-sm);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      background: var(--app-bg);
      color: var(--app-text);
      transition: border-color var(--app-transition);
    }
    .time-input:focus {
      outline: none;
      border-color: var(--app-accent);
    }
    .btn-cancel {
      width: 100%;
      margin-top: 12px;
      background: rgba(255,100,100,0.2);
      color: #f66;
    }

    .vote-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      padding: 14px 20px;
      border: none;
      border-radius: var(--app-radius-sm);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--app-transition), opacity var(--app-transition);
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }
    .btn-secondary {
      background: var(--app-surface);
      color: var(--app-text);
      border: 2px solid var(--app-text-muted);
    }
    .btn-confirm {
      width: 100%;
      margin-top: 12px;
      background: var(--app-accent);
      color: #1a1a1a;
    }

    .participants {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .participants li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-weight: 500;
    }
    .participants li:last-child { border-bottom: none; }
    .participants .badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .participants .badge-yes { background: var(--app-accent-soft); color: var(--app-accent); }
    .participants .badge-no { background: rgba(255,100,100,0.2); color: #f66; }
    .participants .empty { color: var(--app-text-muted); font-weight: 400; }

    .countdown-box {
      text-align: center;
      padding: 32px 20px;
      background: var(--app-accent-soft);
      border-radius: var(--app-radius);
      margin: 20px 0;
    }
    .countdown-box .label {
      font-size: 0.85rem;
      color: var(--app-text-muted);
      margin-bottom: 8px;
    }
    .countdown-box .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--app-accent);
      letter-spacing: -0.02em;
    }

    .error-box {
      background: rgba(255,100,100,0.15);
      color: #f66;
      padding: 20px;
      border-radius: var(--app-radius);
      text-align: center;
      font-weight: 500;
    }
    .loading {
      text-align: center;
      padding: 48px 20px;
      color: var(--app-text-muted);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--app-accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root" class="app">
    <div id="loading" class="loading">Загрузка</div>
    <div id="screen-start" class="screen">
      <div class="header">
        <div class="header-icon">☕</div>
        <h1>Сбор на кофе</h1>
        <p>Укажите время встречи</p>
      </div>
      <div class="card">
        <p class="card-title">Во сколько встречаемся?</p>
        <div class="time-picker-row">
          <input type="time" id="time-input" class="time-input" min="" step="300">
          <button type="button" class="btn btn-primary" id="btn-create">Создать сбор</button>
        </div>
      </div>
    </div>
    <div id="screen-vote" class="screen">
      <div class="header">
        <div class="header-icon">☕</div>
        <h1>Сбор на кофе</h1>
        <p id="vote-meta" class="header-sub">—</p>
      </div>
      <div class="card">
        <p class="card-title">Участвуют</p>
        <ul class="participants" id="vote-yes-list"></ul>
      </div>
      <div class="card">
        <p class="card-title">Не смогут</p>
        <ul class="participants" id="vote-no-list"></ul>
      </div>
      <div class="vote-buttons">
        <button type="button" class="btn btn-primary" id="btn-yes">✅ Участвую</button>
        <button type="button" class="btn btn-secondary" id="btn-no">❌ Не смогу</button>
      </div>
      <button type="button" class="btn btn-confirm" id="btn-confirm" style="display:none">🔒 Подтвердить сбор</button>
    </div>
    <div id="screen-confirmed" class="screen">
      <div class="header">
        <div class="header-icon">🔒</div>
        <h1>Сбор подтверждён</h1>
        <p id="confirmed-meta">—</p>
      </div>
      <div class="countdown-box">
        <p class="label">До встречи осталось</p>
        <p class="value" id="countdown">—</p>
      </div>
      <button type="button" class="btn btn-cancel" id="btn-cancel" style="display:none">❌ Отменить сбор</button>
    </div>
    <div id="screen-error" class="screen">
      <div class="header">
        <div class="header-icon">⚠️</div>
        <h1>Ошибка</h1>
      </div>
      <p class="error-box" id="error-text"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
