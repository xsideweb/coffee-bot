<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Сбор на кофе</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Фиксированная палитра — не зависит от темы Telegram */
    :root {
      --app-bg: #0f0f0f;
      --app-surface: #1a1a1a;
      --app-text: #e4e4e7;
      --app-text-muted: #71717a;
      --app-accent: #7c3aed;
      --app-accent-soft: rgba(124, 58, 237, 0.22);
      --app-primary-bg: #7c3aed;
      --app-primary-text: #ffffff;
      --app-border: #2a2a2a;
      --app-border-muted: #27272a;
      --app-danger-bg: rgba(239, 68, 68, 0.18);
      --app-danger-text: #ef4444;
      --app-radius: 12px;
      --app-radius-sm: 10px;
      --app-transition: 0.15s ease;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--app-bg) !important;
      color: var(--app-text) !important;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .app {
      max-width: 400px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .screen { display: none; animation: fadeIn 0.2s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header-icon {
      font-size: 32px;
      margin-bottom: 12px;
      line-height: 1;
      opacity: 0.9;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 6px;
      letter-spacing: -0.03em;
    }
    .header p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--app-text-muted) !important;
      font-weight: 400;
    }

    .card {
      background: var(--app-surface) !important;
      border-radius: var(--app-radius);
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--app-border) !important;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--app-text-muted) !important;
      margin: 0 0 10px;
    }

    .card-time { padding: 24px; }
    .time-input-wrap {
      display: flex;
      align-items: center;
      min-height: 52px;
      padding: 0 14px;
      background: var(--app-bg) !important;
      border: 2px solid var(--app-border);
      border-radius: var(--app-radius-sm);
      transition: border-color var(--app-transition);
    }
    .time-input-wrap:focus-within {
      border-color: var(--app-accent);
    }
    .time-input-wrap .time-input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: none;
      background: transparent !important;
      outline: none;
      font-family: inherit;
      font-size: 1.5rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--app-text) !important;
      opacity: 1;
      position: static;
    }
    .time-input-wrap .time-input::placeholder { color: var(--app-text-muted) !important; }
    .time-input-hint {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--app-text-muted);
    }
    .btn-create { margin-top: 20px; }
    .btn-close-app {
      width: 100%;
      margin-top: 12px;
      min-height: 48px;
      background: transparent !important;
      color: var(--app-text-muted) !important;
      border: 1px solid var(--app-border-muted);
      border-radius: var(--app-radius-sm);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color var(--app-transition), color var(--app-transition);
    }
    .btn-close-app:hover { border-color: var(--app-text-muted); color: var(--app-text) !important; }
    .btn-cancel,
    .btn-cancel-vote {
      width: 100%;
      margin-top: 12px;
      min-height: 48px;
      background: var(--app-danger-bg) !important;
      color: var(--app-danger-text) !important;
      border: 1px solid rgba(239, 68, 68, 0.35);
      font-family: inherit;
      font-weight: 500;
    }

    .vote-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 48px;
      padding: 12px 18px;
      border: none;
      border-radius: var(--app-radius-sm);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity var(--app-transition);
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--app-primary-bg) !important;
      color: var(--app-primary-text) !important;
    }
    .btn-secondary {
      background: var(--app-surface) !important;
      color: var(--app-text) !important;
      border: 1px solid var(--app-border-muted);
    }
    .btn-confirm {
      width: 100%;
      margin-top: 12px;
      background: var(--app-accent) !important;
      color: var(--app-primary-text) !important;
    }

    .participants {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .participants li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--app-border);
      font-weight: 500;
      font-size: 0.9375rem;
      color: var(--app-text) !important;
    }
    .participants li:last-child { border-bottom: none; }
    .participants .badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .participants .badge-yes { background: var(--app-accent-soft); color: var(--app-accent) !important; }
    .participants .badge-no { background: var(--app-danger-bg); color: var(--app-danger-text) !important; }
    .participants .empty { color: var(--app-text-muted) !important; font-weight: 400; }

    .countdown-box {
      text-align: center;
      padding: 28px 20px;
      background: var(--app-accent-soft);
      border: 1px solid var(--app-border);
      border-radius: var(--app-radius);
      margin: 20px 0;
    }
    .countdown-box .label {
      font-size: 0.8rem;
      color: var(--app-text-muted) !important;
      margin-bottom: 6px;
    }
    .countdown-box .value {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--app-accent) !important;
      letter-spacing: -0.02em;
    }

    .error-box {
      background: var(--app-danger-bg);
      color: var(--app-danger-text) !important;
      padding: 16px 20px;
      border-radius: var(--app-radius-sm);
      border: 1px solid rgba(239, 68, 68, 0.3);
      text-align: center;
      font-size: 0.9rem;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--app-text-muted) !important;
      font-size: 0.9rem;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--app-accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root" class="app">
    <div id="loading" class="loading">Загрузка</div>
    <div id="screen-start" class="screen">
      <div class="header">
        <div class="header-icon">☕</div>
        <h1>Сбор на кофе</h1>
        <p>Укажите время встречи</p>
      </div>
      <div class="card card-time">
        <p class="card-title">Во сколько встречаемся? (ваш часовой пояс)</p>
        <div class="time-input-wrap">
          <input type="text" id="time-input" class="time-input" placeholder="ЧЧ:ММ" maxlength="5" inputmode="numeric" pattern="[0-9:]*" aria-label="Время встречи">
        </div>
        <p class="time-input-hint">Например: 14:30 или 09:00</p>
        <button type="button" class="btn btn-primary btn-create" id="btn-create">Создать сбор</button>
      </div>
    </div>
    <div id="screen-vote" class="screen">
      <div class="header">
        <div class="header-icon">☕</div>
        <h1>Сбор на кофе</h1>
        <p id="vote-meta" class="header-sub">—</p>
      </div>
      <div class="card">
        <p class="card-title">Участвуют</p>
        <ul class="participants" id="vote-yes-list"></ul>
      </div>
      <div class="card">
        <p class="card-title">Не смогут</p>
        <ul class="participants" id="vote-no-list"></ul>
      </div>
      <div class="vote-buttons">
        <button type="button" class="btn btn-primary" id="btn-yes">✅ Участвую</button>
        <button type="button" class="btn btn-secondary" id="btn-no">❌ Не смогу</button>
      </div>
      <button type="button" class="btn btn-confirm" id="btn-confirm" style="display:none">🔒 Подтвердить сбор</button>
      <button type="button" class="btn btn-cancel-vote" id="btn-cancel-vote" style="display:none">❌ Отменить сбор</button>
      <button type="button" class="btn btn-close-app" id="btn-close">Закрыть приложение</button>
    </div>
    <div id="screen-confirmed" class="screen">
      <div class="header">
        <div class="header-icon">🔒</div>
        <h1>Сбор подтверждён</h1>
        <p id="confirmed-meta">—</p>
      </div>
      <div class="countdown-box">
        <p class="label">До встречи осталось</p>
        <p class="value" id="countdown">—</p>
      </div>
      <button type="button" class="btn btn-cancel" id="btn-cancel" style="display:none">❌ Отменить сбор</button>
    </div>
    <div id="screen-error" class="screen">
      <div class="header">
        <div class="header-icon">⚠️</div>
        <h1>Ошибка</h1>
      </div>
      <p class="error-box" id="error-text"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
