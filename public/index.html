<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сбор на кофе</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-theme-bg-color: #fff;
      --tg-theme-text-color: #000;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #fff;
      --tg-theme-secondary-bg-color: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
    }
    .vote-row {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .vote-row .btn { flex: 1; }
    .list { list-style: none; padding: 0; margin: 0 0 1rem; }
    .list li { padding: 8px 0; border-bottom: 1px solid var(--tg-theme-secondary-bg-color); }
    .list li:last-child { border-bottom: none; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    .countdown { font-size: 1.5rem; text-align: center; padding: 1.5rem; }
    .error { color: #c00; padding: 10px; margin-bottom: 1rem; }
    .loading { text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading" class="loading">Загрузка…</div>
    <div id="screen-start" class="screen">
      <h1>☕ Сбор на кофе</h1>
      <p class="meta">Выберите, через сколько минут сбор</p>
      <div class="time-grid" id="time-grid"></div>
    </div>
    <div id="screen-vote" class="screen">
      <h1>☕ Сбор на кофе</h1>
      <p class="meta" id="vote-meta"></p>
      <ul class="list" id="vote-yes-list"></ul>
      <p class="meta">Не смогут:</p>
      <ul class="list" id="vote-no-list"></ul>
      <div class="vote-row">
        <button type="button" class="btn" id="btn-yes">✅ Участвую</button>
        <button type="button" class="btn btn-secondary" id="btn-no">❌ Не смогу</button>
      </div>
      <button type="button" class="btn" id="btn-confirm" style="display:none">🔒 Подтвердить сбор</button>
    </div>
    <div id="screen-confirmed" class="screen">
      <h1>🔒 Сбор подтверждён</h1>
      <p class="meta" id="confirmed-meta"></p>
      <p class="countdown" id="countdown"></p>
    </div>
    <div id="screen-error" class="screen">
      <p class="error" id="error-text"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
